[project]
name = "xarray-bounds"
version = "0.5.8"
description = "An xarray accessor for CF-compliant bounds "
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mike Blackett", email = "27811528+mikeblackett@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "cf-xarray",
    "numpy",
    "pandas",
    "xarray>=2025.03.1",
]
[project.urls]
Repository = "https://github.com/mikeblackett/xarray-bounds"
DOCUMENTATION = "https://xarray-bounds.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pandas-stubs",
    "pyright",
    "pytest-mock>=3.16.0",
    "ruff",
    "xarray[accel,io,parallel]",
    { include-group = "docs" },
    { include-group = "test" },
]
docs = [
    "myst-nb",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
]
test = [
    "coverage",
    "hypothesis",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 79

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.coverage.run]
source = ["xarray_bounds"]

[tool.pytest.ini_options]
addopts = "--cov=xarray_bounds --cov-report=xml --cov-report=term"
testpaths = ["tests"]
